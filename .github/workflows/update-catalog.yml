name: Daily Catalog Sync

on:
  schedule:
    # Run daily at 6:00 AM Romania time (EET = UTC+2, EEST = UTC+3)
    # Using 3:00 AM UTC to cover both winter (EET) and summer (EEST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install openpyxl

    - name: Sync product feed from Sport X Team
      run: python scripts/sync_feed.py

    - name: Check for changes
      id: changes
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected:"
          git diff --cached --stat
        fi

    - name: Commit and push
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config user.email "action@github.com"
        git config user.name "BikeStylish Bot"
        git commit -m "🔄 Daily catalog sync - $(date -u '+%Y-%m-%d %H:%M UTC')

        Automated sync from Sport X Team product feed.
        See last_sync.json for details."
        git push
